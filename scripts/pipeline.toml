# What scripts/pipeline.py builds, tests and measures.
#
# Paths are relative to the repository root unless absolute. Anything here can
# be overridden from the environment (noted per key) so a machine-specific
# path never has to be committed.

[tools]
# The one AMD release Ouroboros builds with. pipeline.py refuses any other:
# directives and report formats change between releases.
version = "2026.1"
# Where it is installed. Override: OUROBOROS_AMD_ROOT.
root = "Z:/FPGA/2026.1"

[doomv]
# The golden model. Override: OUROBOROS_DOOMV_ROOT.
root = "Tools/Verification/DoomV"
exe = "riscv_doom.exe"

# Targets are read from the Vitis installation: a board from the AMD board
# store (which fixes the part), or a full part (device-package-speed).
# `pipeline.py targets` lists families, boards and devices.
[defaults]
target = "kv260_som"
clock_mhz = 100   # a configuration choice, not a property of the board

# HLS components. Each has a directory holding an hls_config.cfg (without part
# or clock -- the pipeline adds the target's) and its sources.
#
#   kind      "smoke" (toolchain test infrastructure), "core", "unit", "accelerator"
#   cosim     whether the co-simulation stage applies
#   dut       for kind "core": how to run it on a test ELF so it writes a
#             Sail-format trace -- see [selftest] for the placeholders
[components.smoke]
dir = "Tools/Verification/smoke"
kind = "smoke"
cosim = true

[components.calibration-rv32i]
dir = "Tools/Verification/calibration/rv32i"
kind = "calibration"
cosim = true

# Test suites for the accuracy stage, as globs under DoomV's root. Each test
# runs on the device under test, which writes a Sail-format trace, and DoomV
# lock-steps against that trace, strictly (docs/lockstep.md).
[suites.riscv-tests]
glob = "tools/verification/tests/suites/riscv-tests/rv64u*-p-*"
march = "rv64imafdcvh_zicsr_zifencei_zba_zbb_zbs_zicond_zihintpause_zihintntl_zimop_zcmop_zicbom_zicbop_zicboz_zawrs_zfa_zfh_svinval_svnapot_svpbmt_sscofpmf_ssstateen_ssnpm_smnpm_sspm_zvfh_zvfhmin_zvfbfmin_zvfbfwma_zvbb_zvkb_zvbc_zvkg_zvkned_zvknha_zvknhb_zvksed_zvksh_sv48_sv57_svadu_zkr_zicfilp_zicfiss_zbc_zbkb_zbkx_zfh"
max_steps = 100000000

[suites.riscv-tests-priv]
glob = "tools/verification/tests/suites/riscv-tests/rv64[ms]i-p-*"
march = "rv64imafdcvh_zicsr_zifencei_zba_zbb_zbs_zicond_zihintpause_zihintntl_zimop_zcmop_zicbom_zicbop_zicboz_zawrs_zfa_zfh_svinval_svnapot_svpbmt_sscofpmf_ssstateen_ssnpm_smnpm_sspm_zvfh_zvfhmin_zvfbfmin_zvfbfwma_zvbb_zvkb_zvbc_zvkg_zvkned_zvknha_zvknhb_zvksed_zvksh_sv48_sv57_svadu_zkr_zicfilp_zicfiss_zbc_zbkb_zbkx_zfh"
max_steps = 100000000

[suites.lockstep-directed]
glob = "build/lockstep-elf/*"
march = "rv64imafdcvh_zicsr_zifencei_zba_zbb_zbs_zicond_zihintpause_zihintntl_zimop_zcmop_zicbom_zicbop_zicboz_zawrs_zfa_zfh_svinval_svnapot_svpbmt_sscofpmf_ssstateen_ssnpm_smnpm_sspm_zvfh_zvfhmin_zvfbfmin_zvfbfwma_zvbb_zvkb_zvbc_zvkg_zvkned_zvknha_zvknhb_zvksed_zvksh_sv48_sv57_svadu_zkr_zicfilp_zicfiss_zbc_zbkb_zbkx_zfh"
max_steps = 100000000

# The self-test: DoomV stands in for the core as the device under test, so the
# accuracy stage's whole path -- run, trace, lock-step, report -- is exercised
# before the core exists. When a core component exists, its `dut` replaces
# this. Placeholders: {doomv} {wad} {elf} {march} {tohost} {trace} {steps}.
[selftest]
dut = ["{doomv}", "-ng", "{wad}", "{elf}", "-march={march}", "-tohost={tohost}", "-trace={trace}", "-stopat={steps}"]
suites = ["riscv-tests", "riscv-tests-priv"]
